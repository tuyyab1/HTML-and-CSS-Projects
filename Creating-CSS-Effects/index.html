<!DOCTYPE html>
<html>
    <head>
        <title>Creating Effects with CSS</title>
        <meta charset="UTF-8">

        <!-- Google Font import -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--NAVBAR-->
        <nav class="nav-bar">
            <ul>
                <li>    
                    <a href="#">Home</a>
                </li>
                <li class="dropdown">
                    <a href="#">Images</a>
                    <div class="rollover-menu">
                        <a href="#image1">Image1  </a>
                        <a href="#image2">Image2  </a>
                        <a href="#image3">Image3  </a>
                    </div>
                </li>
            </ul>
        </nav>
        <!--IMAGES -->
        <section>
            <!--IMAGE ONE-->
            <div class="image-container" id="image1">
                <img src="images/japan1.jpg">
                <div class="overlay"></div>
            </div>
            <!--IMAGE TWO-->
            <div class="image-container" id="image2">
                <img src="images/japan2.jpg" class="zoom">
            </div>
            <!--IMAGE THREE-->
            <div class="image-container" id="image3">
                <div class="circle">
                     <img src="images/japan3.jpg">
                </div>
            </div>
        </section>
        <!--FOOTER-->
        <footer>
            <div class="footer-text">
                <p>The Tech Academy &copy;</p>
            </div>
        </footer>
    </body>
</html>
